<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Weight Tracker reminder</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <link rel="stylesheet" href="./reminder.css" />
  </head>
  <body>
    <div class="reminder-container">
      <div class="reminder-card">
        <p class="reminder-date"></p>
        <h1 class="reminder-title">Log your weight</h1>
        <p class="reminder-subtitle">It's a new day. Take a moment to step on the scale.</p>

        <div class="reminder-input-row">
          <input type="number" id="weight-input" placeholder="0.0" step="0.1" min="1" inputmode="decimal" autofocus />
          <span class="unit-label">lbs</span>
        </div>

        <div class="reminder-actions">
          <button class="btn-secondary" id="remind-later-btn" type="button">Remind me in 1 hour</button>
          <button class="btn-primary" id="save-btn" type="button" disabled>Save</button>
        </div>

        <button class="dismiss-link" id="dismiss-btn" type="button">Skip today</button>
      </div>
    </div>
    <script type="module" src="./reminder.js"></script>
  </body>
</html>
